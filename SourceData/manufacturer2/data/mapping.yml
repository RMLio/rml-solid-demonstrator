prefixes:
    acl: http://www.w3.org/ns/auth/acl#
    formats: http://www.w3.org/ns/formats/
    xsd: http://www.w3.org/2001/XMLSchema#
    rdfs: http://www.w3.org/2000/01/rdf-schema#
    ex: http://example.com/
    voc: http://example.com/voc/
    voc2: http://example.com/voc2/
    idlab-fn: https://w3id.org/imec/idlab/function#
    grel: http://users.ugent.be/~bjdmeest/function/grel.ttl#
base: http://knows.com/base/
sources:
    ls_company:
        access: ./company.csv
        referenceFormulation: csv
    ls_products:
        access: ./products.csv
        referenceFormulation: csv
    ls_acl:
        access: ./acl.csv
        referenceFormulation: csv
targets:
    #static targets
    lt_products:
        type: directhttprequest
        access: http://localhost:3000/manufacturer2/products
        serialization: jsonld
        authentication: auth
    lt_index:
        type: directhttprequest
        access: http://localhost:3000/manufacturer2/index
        serialization: turtle
        authentication: auth
    # dynamic targets
    dlt_productid:
        source: ls_products
        type: directhttprequest
        id: dlt-$(productId)
        access: http://localhost:3000/manufacturer2/product-$(productId)
        serialization: jsonld
        authentication: auth
    dlt_acl-access-to:
        source: ls_acl
        type: linkedhttprequest
        access: http://localhost:3000/manufacturer2/$(access_to)
        rel: acl
        serialization: turtle
        authentication: auth
authentications:
    auth:
        type: cssclientcredentials
        email: hello@manufacturer2.com
        password: abc123
        oidcIssuer: http://localhost:3000/
        webId: http://localhost:3000/manufacturer2/profile/card#me
        index: http://localhost:3000/manufacturer2/index
mappings:
    tm_company:
      sources: ls_company
      s:
        value: http://localhost:3000/manufacturer2/profile/card#me
        targets: 
        - lt_products
      po:  
        - [ a, voc:Manufacturer~iri ]
        - [ rdfs:label, $(company_label) ]
    tm_products:
        sources: ls_products
        s:
            value: ex:manufacturer2/$(productId)
            targets:
               - dlt_productid
        po:
            - p: a
              o:
                value: voc:Product
                type: iri
                targets:
                - lt_products
            - p: rdfs:label
              o:
                value: $(label)
                targets:
                - lt_products
            - p: voc:category
              o:
                value: $(category)
                targets:
                - lt_products
            - p: voc:reachCompliant
              o:
                function: idlab-fn:equal
                parameters:
                - [ grel:valueParameter, $(reachCompliant) ]
                - [ grel:valueParameter2, Yes ]
                datatype: xsd:boolean
                targets:
                - lt_products
            - p: voc:recycledScore
              o:
                value: $(recycledScore)
                targets:
                - lt_products
            - p: voc:manufacturer
              o:
                value: http://localhost:3000/manufacturer2/profile/card#me
                type: iri
                targets:
                - lt_products
            - [voc:volumeML, $(volume), xsd:decimal]
            - [voc:percentageBenzene, $(percentageBenzene), xsd:decimal]
            - [voc:percentageRecycled, $(percentageRecycled), xsd:decimal]
            - [voc:originCountry, $(originCountry)]
    acl:
        sources: ls_acl
        s:
          value: ex:acl_$(id)
          targets: dlt_acl-access-to
        po:
          - [ a, acl:Authorization~iri ]
          - [ acl:accessTo, http://localhost:3000/manufacturer2/$(access_to)~iri ]
          - p: acl:mode
            o: acl:Read~iri
            condition:
              function: idlab-fn:equal
              parameters:
                - [ grel:valueParameter, $(read_access) ]
                - [ grel:valueParameter2, Yes ]
          - p: acl:mode
            o: acl:Write~iri
            condition:
              function: idlab-fn:equal
              parameters:
                - [ grel:valueParameter, $(write_access) ]
                - [ grel:valueParameter2, Yes ]
          - p: acl:mode
            o: acl:Control~iri
            condition:
              function: idlab-fn:equal
              parameters:
                - [ grel:valueParameter, $(control_access) ]
                - [ grel:valueParameter2, Yes ]
          - p: acl:agent
            o:
              value: $(agent_webid)
              type: iri
          - p: acl:agentClass
            o:
              value: $(agent_class)
              type: iri
    index1:
        sources: ls_acl
        s:
            value: ex:index
            targets: lt_index
        po:
        - p: rdfs:seeAlso
          o:
            value: http://localhost:3000/manufacturer2/$(access_to)
            type: iri
          condition:
              function: idlab-fn:notEqual
              parameters:
              - [ grel:valueParameter, $(access_to) ]
              - [ grel:valueParameter2, index ]
    index2:
        sources: ls_products
        s:
            value: ex:index
            targets: lt_index
        po:
        - p: rdfs:seeAlso
          o:
            value: http://localhost:3000/manufacturer2/product-$(productId)
            type: iri
